<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RumiaAnimation</title>

  <!-- Google Fonts: Poppins -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- 自分用のFont Awesomeキット -->
  <script src="https://kit.fontawesome.com/282c30e639.js" crossorigin="anonymous"></script>

  <style>
    /* リセット */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* body: 背景にタイル状の画像を設定 */
    body {
      font-family: 'Poppins', sans-serif;
      color: #2B2E47;
      background:
        /* ベース色は白 */
        #fff
        /* 背景画像をタイル状に繰り返し */
        url("https://rumiaanimation.github.io/main/HPhaikei.png")
        repeat
        center center;
      background-size: 200px 200px; 
      overflow-x: hidden; /* 横スクロール防止 */
    }

    /* コンテナ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    /* メインタイトル */
    .main-title {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    /* Rumiaを強調表示するクラス */
    .highlight {
      color: #FFC107; /* Font Awesome公式の “website.” と同じようなゴールド系 */
    }

    /* サブタイトル / 説明文 */
    .sub-title {
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto 40px auto;
      color: #4C5B66;
      line-height: 1.6;
    }

    /* リンクボタンラッパ */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 400px;
      margin: 0 auto;
      margin-bottom: 60px;
    }

    /* リンクボタン（Font Awesome公式風） */
    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2em;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;         /* 角の丸み */
      border: 2px solid #2B2E47; /* 太めのアウトライン */
      color: #2B2E47;            /* 文字色はネイビー系 */
      background-color: #fff;    /* 白地ボタン */
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .link-button i {
      margin-right: 8px;
      font-size: 1.2em;
    }
    /* ホバー時: 背景をネイビーに塗りつぶし、文字を白に反転 */
    .link-button:hover {
      background-color: #2B2E47;
      color: #fff;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 20px;
      color: #4C5B66;
      font-size: 0.9rem;
      border-top: 1px solid #e0e0e0;
      margin-top: 40px;
    }

    /* レスポンシブ対応 */
    @media (max-width: 600px) {
      .main-title {
        font-size: 2rem;
      }
      .sub-title {
        font-size: 1rem;
      }
      .link-button {
        font-size: 1rem;
        padding: 12px 20px;
      }
      .link-button i {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- タイトル -->
    <h1 class="main-title">
      <span class="highlight">Rumia</span>Animation
    </h1>
    <!-- サブタイトル -->
    <p class="sub-title">
      ルミアアニメーションへようこそ！<br>
      スマホアプリをリリースしました！ぜひご利用ください♪
    </p>

    <!-- リンクボタン一覧 -->
    <div class="links-container">
      <a
        href="https://www.youtube.com/channel/UCK_cKJh2CTMVEh9_dgpy1cg"
        target="_blank"
        class="link-button"
      >
        <i class="fab fa-youtube"></i>YouTube
      </a>
      <a
        href="https://apps.apple.com/jp/app/%E3%83%AB%E3%83%9F%E3%82%A2%E3%83%99%E3%83%93%E3%83%BC%E3%82%B9%E3%83%AA%E3%83%BC%E3%83%97/id6742806839"
        target="_blank"
        class="link-button"
      >
        <i class="fas fa-mobile-alt"></i>スマホアプリ
      </a>
      <a
        href="https://suzuri.jp/RumiaAnimation/products"
        target="_blank"
        class="link-button"
      >
        <i class="fab fa-Originalgoods"></i>オリジナルグッズ
      </a>
      <a
        href="https://www.instagram.com/rumia_animation/"
        target="_blank"
        class="link-button"
      >
        <i class="fab fa-instagram"></i>Instagram
      </a>
      <!-- お問い合わせリンク追加 -->
      <a
        href="mailto:rumia.animation@gmail.com"
        class="link-button"
      >
        <i class="fas fa-envelope"></i>お問い合わせ
      </a>
    </div>
  </div>

  <!-- フッター -->
  <footer>
    &copy; 2025 RumiaAnimation. All rights reserved.
  </footer>

</body>
</html>
